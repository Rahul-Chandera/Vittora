name: CI

on:
  # Push runs only on develop (covers direct admin pushes that bypass PRs).
  # main receives code exclusively via the release PR, whose required check
  # already tested the identical tree (require-up-to-date), so a push run
  # there was pure duplication of ~40min macOS runner time.
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  LC_CTYPE: en_US.UTF-8

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set US locale
        run: ./Scripts/ci/set-us-locale.sh

      - name: Show toolchain
        run: xcodebuild -version

      - name: make build-ios
        run: make build-ios

      # Reads the watch target's .stringsdata, which `make build-ios` produces
      # because the watch app is embedded. This is the check that would have
      # caught the watch shipping unlocalized.
      - name: Watch string catalogue in sync
        run: DERIVED=.build-ios Scripts/ci/sync-watch-strings.py --check

      - name: make build-macos
        run: make build-macos

      # Deliberately after BOTH builds. The check reads the compiler's
      # .stringsdata, and a string inside `#if os(macOS)` is never compiled by
      # the iOS build — so an iOS-only scan cannot see it at all. Running it
      # against .build-ios alone let "Running on macOS" sit in the catalogue
      # untranslated and nearly shipped the macOS ShareSheet strings the same
      # way. Both paths, or the gap silently reopens.
      - name: Localization coverage
        run: DERIVED=.build-ios:.build-macos Scripts/ci/check-localization-coverage.sh --list

      # Coverage says a key is present and translated. It cannot say the
      # translation is format-compatible with the key, which is what crashed
      # Hindi in #257: the same placeholders in a different order. Reads the
      # catalogue directly, so it needs no build and could run anywhere — it
      # sits here to keep every localization gate in one place.
      - name: Placeholder order
        run: |
          Scripts/ci/check-placeholder-order.py --self-test
          Scripts/ci/check-placeholder-order.py --list

  # The three test legs each compiled the same 983-file graph on their own
  # runner — 8.7, 11.8 and 12.1 min in run 34498303869, ~33 runner-min per run.
  # Compile once here and pass the products on.
  #
  # Deliberately a separate job from `build`: the iOS-device and macOS compiles
  # plus the localization checks are 6.4 min that the test legs do not need, and
  # folding them in would push that onto the critical path in front of the
  # longest test leg.
  build-for-testing:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set US locale
        run: ./Scripts/ci/set-us-locale.sh

      - name: make build-for-testing
        run: make build-for-testing

      # tar, not a bare upload-artifact of the directory: upload-artifact zips
      # and drops the executable bit, which leaves the .app unlaunchable. tar
      # also turns 324 files into one and compresses 363 MB to ~90 MB.
      - name: Package test products
        run: tar -czf test-products.tar.gz -C .build-ci/DerivedData/Build Products

      - name: Report artifact size
        run: ls -lh test-products.tar.gz && du -sh .build-ci/DerivedData/Build/Products

      - name: Upload test products
        uses: actions/upload-artifact@v4
        with:
          name: test-products-${{ github.run_id }}
          path: test-products.tar.gz
          # Already gzipped; re-deflating it just burns runner time.
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # `make test` ran the suites serially at 53-80 min; the suites each rebuilt the
  # same 983 compile tasks into separate derived-data trees.
  #
  # UI-core used to set the floor at 49 min because it carried the 18 accessibility
  # audits alongside 58 other UI tests. Those audits sample every element on screen,
  # and sharing a runner with the rest is what produced "Audit failed to complete in
  # time" — XCTest's own audit timeout, which says nothing about the screen under
  # test. They are `test-ios-ui-audit` now, which both removes that contention and
  # runs the two halves in parallel.
  #
  # 90, not 75: runner speed varies ~1.5x on identical content (measured), so
  # UI-core's 49 min can land near 70. A tight cap here would reintroduce the
  # timeout kills that #216 raised the old cap to escape.
  test:
    name: test (${{ matrix.suite }})
    runs-on: macos-15
    needs: build-for-testing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: test-unit
            result: Test-Unit.xcresult
          - suite: test-ios-ui-core
            result: Test-iOS-UI.xcresult
          - suite: test-ios-ui-audit
            result: Test-iOS-UI-Audit.xcresult
          - suite: test-ios-ui-onboarding
            result: Test-iOS-UI-Onboarding.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set US locale
        run: ./Scripts/ci/set-us-locale.sh

      - name: Show toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available | head -40 || true

      - name: Resolve iOS Simulator destination
        id: simulator
        run: |
          IOS_SIM_DEST="$(./Scripts/ci/resolve-ios-simulator-destination.sh)"
          echo "IOS_SIM_DEST=$IOS_SIM_DEST" >> "$GITHUB_ENV"
          echo "destination=$IOS_SIM_DEST" >> "$GITHUB_OUTPUT"

      - name: Boot iOS Simulator
        run: ./Scripts/ci/boot-simulator-if-needed.sh "$IOS_SIM_DEST"

      - name: Download test products
        uses: actions/download-artifact@v4
        with:
          name: test-products-${{ github.run_id }}

      - name: Unpack test products
        run: |
          mkdir -p .build-ci/DerivedData/Build
          tar -xzf test-products.tar.gz -C .build-ci/DerivedData/Build
          ls -l .build-ci/DerivedData/Build/Products/*.xctestrun

      # Reports the exit code rather than swallowing it, so a failure can be
      # classified from the log instead of re-run blind.
      #
      # CORRECTION, and the reason this comment is long: the justification first
      # written here claimed the audit leg was failing with every test passing.
      # That was wrong, and wrong because of how the evidence was gathered.
      # `gh run view --job <id> --log-failed` returns the log of the LATEST
      # attempt, so on a job that had already been re-run it returns the passing
      # rerun — which is what "0 failures / TEST EXECUTE SUCCEEDED" came from.
      #
      # The failed attempt says the opposite, and this step is what showed it:
      #
      #   make test-ios-ui-audit exited 2
      #   Executed 18 tests, with 2 tests skipped and 2 failures
      #   ** TEST EXECUTE FAILED **
      #   testNewReportsAccessibilityAudit : Contrast failed
      #
      # So the audit leg fails because audits genuinely fail, intermittently, and
      # testNewReportsAccessibilityAudit on the Reports screen is the usual one.
      # To read a specific attempt, use the API, not --log-failed:
      #   gh api repos/<owner>/<repo>/actions/runs/<run>/attempts/<n>/jobs
      #
      # The step still earns its place — "exited 2" versus "exited 0" is what
      # distinguished the two attempts. Nothing is masked; a non-zero status
      # still fails the job.
      - name: make ${{ matrix.suite }}
        run: |
          # `set +e` is load-bearing: GitHub runs this with `bash -e`, so without it
          # a failing make exits the shell before the status is ever read or echoed,
          # which is exactly the information this step exists to capture.
          set -o pipefail
          set +e
          make ${{ matrix.suite }}
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::notice::make ${{ matrix.suite }} exited 0"
          else
            echo "::error::make ${{ matrix.suite }} exited $status (65 = test failure, 70/71 = infrastructure)"
          fi
          exit $status
        env:
          IOS_SIM_DEST: ${{ env.IOS_SIM_DEST }}
          PREBUILT_TESTS: "1"

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.suite }}-${{ github.run_id }}
          path: .build-ci/${{ matrix.result }}
          if-no-files-found: warn
          retention-days: 14

  # Branch protection requires a check called `build-and-test` (see
  # `.github/BRANCH_PROTECTION.md`), so the name is kept as an aggregator
  # over the real jobs rather than renamed.
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    needs: [build, build-for-testing, test]
    if: always()
    steps:
      - name: Gate on build and test results
        run: |
          echo "build=${{ needs.build.result }} build-for-testing=${{ needs.build-for-testing.result }} test=${{ needs.test.result }}"
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.build-for-testing.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1
